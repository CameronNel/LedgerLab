name: LedgerLab workspace checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - run: npm install --global typescript@5.8.3 @types/node@22.19.19 --ignore-scripts --no-audit --no-fund
      - run: node scripts/accounting/run-portable.mjs
        env:
          LEDGERLAB_DAY_FIXTURE: /tmp/ledgerlab-daily.json
          LEDGERLAB_REVIEW_FIXTURE: /tmp/ledgerlab-review.json
      - run: tsc -p tsconfig.standalone.json && node scripts/desktop/check-source-syntax.mjs
      - run: node scripts/desktop/bundle.mjs /tmp/LedgerLab-Workstation-v3.2.html
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Chromium acceptance
        run: |
          export CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python scripts/desktop/check-local-storage.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/storage-check
          python scripts/desktop/check-clarity.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/clarity-check
          python scripts/desktop/check-workspace.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/ledgerlab-daily.json /tmp/workspace-check
          python scripts/desktop/check-workday.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/ledgerlab-daily.json /tmp/workday-check
          python scripts/desktop/check-workstation.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/workstation-check
          python scripts/desktop/check-month-review.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/ledgerlab-review.json /tmp/month-check
          python scripts/desktop/check-clipboard.py /tmp/LedgerLab-Workstation-v3.2.html /tmp/clipboard-check
      - name: Retain browser screenshots and check summaries, never case fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerlab-browser-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/storage-check/*.png
            /tmp/storage-check/results.json
            /tmp/clarity-check/*.png
            /tmp/clarity-check/results.json
            /tmp/workspace-check/*.png
            /tmp/workspace-check/results.json
            /tmp/workday-check/*.png
            /tmp/workday-check/results.json
            /tmp/workstation-check/*.png
            /tmp/workstation-check/results.json
            /tmp/month-check/*.png
            /tmp/month-check/results.json
            /tmp/clipboard-check/*.png
            /tmp/clipboard-check/results.json
  full-application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  package:
    needs: [standalone, full-application]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - run: npm install --global typescript@5.8.3 @types/node@22.19.19 --ignore-scripts --no-audit --no-fund
      - name: Build reproducible standalone and complete source package
        run: |
          set -euo pipefail
          node scripts/desktop/bundle.mjs public/offline/LedgerLab-Workstation.html
          node scripts/desktop/bundle.mjs /tmp/ledgerlab-rebuild.html
          cmp public/offline/LedgerLab-Workstation.html /tmp/ledgerlab-rebuild.html
          python scripts/accounting/package-source.py
          python -c "import zipfile; z=zipfile.ZipFile('public/offline/ledgerlab-source-code.zip'); open('SOURCE-MANIFEST.json','wb').write(z.read('LedgerLab/SOURCE-MANIFEST.json'))"
          python scripts/accounting/package-check.py
      - name: Refresh only generated files on a same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git add public/offline/LedgerLab-Workstation.html SOURCE-MANIFEST.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified standalone and source inventory after full application and browser checks'
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
      - name: Prepare downloadable deliverables with source identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/ledgerlab-release
          cp public/offline/LedgerLab-Workstation.html /tmp/ledgerlab-release/
          cp public/offline/ledgerlab-source-code.zip /tmp/ledgerlab-release/LedgerLab-source.zip
          git rev-parse HEAD > /tmp/ledgerlab-release/SOURCE-COMMIT.txt
          cd /tmp/ledgerlab-release
          sha256sum LedgerLab-Workstation.html LedgerLab-source.zip SOURCE-COMMIT.txt > SHA256SUMS.txt
      - name: Upload only verified application and source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerlab-verified-release
          retention-days: 30
          if-no-files-found: error
          path: /tmp/ledgerlab-release/
