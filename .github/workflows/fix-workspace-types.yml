name: Verify workspace type fixes
on:
  push:
    branches: [ux/clearer-daily-workspace]
    paths: [.github/workflows/fix-workspace-types.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Fix sidebar state and align compiler target with the standalone
        shell: python
        run: |
          from pathlib import Path
          p=Path('components/ledgerlab/app.tsx');s=p.read_text()
          old='[expanded,setExpanded]=useState(active)'
          assert s.count(old)==1
          p.write_text(s.replace(old,'[expanded,setExpanded]=useState<string>(active)'))
          p=Path('tsconfig.json');s=p.read_text();assert s.count('"target": "ES2017"')==1
          p.write_text(s.replace('"target": "ES2017"','"target": "ES2022"'))
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Record verified typecheck and regenerate source inventory
        shell: python
        run: |
          from pathlib import Path
          import subprocess,zipfile
          p=Path('docs/current/verification.md');s=p.read_text()
          old='`npm run typecheck` was attempted but failed because full React/Next/Vinext and other locked dependencies are absent. This is not a full-app typecheck pass. The production build and hosted end-to-end smoke tests remain outstanding.'
          new='Local full-app type checking initially lacked dependencies. GitHub CI then installed all 677 locked packages, exposed a too-narrow sidebar state type and the existing ES2017/worksheet-regex target mismatch, and both were fixed. A subsequent dependency-backed `npm run typecheck` passed on GitHub. Production build and hosted end-to-end smoke verification remain separate; consult the PR checks for their current status.'
          assert old in s;p.write_text(s.replace(old,new))
          p=Path('docs/current/guide.md');s=p.read_text().replace('but full dependency-backed React/build and hosted end-to-end verification remain outstanding.','and dependency-backed React type checking has passed on GitHub; production-build and hosted end-to-end verification remain separate.');p.write_text(s)
          p=Path('README.md');s=p.read_text().replace('unresolved full React/hosting checks','separate full-application and hosting checks');p.write_text(s)
          p=Path('CHATGPT-START-HERE.md');s=p.read_text().replace('Do not claim deployment or a full React build based on the standalone tests.','Full dependency-backed type checking subsequently passed on GitHub. Do not claim deployment or a production build based on the standalone tests.');p.write_text(s)
          p=Path('CHANGELOG.md');s=p.read_text().replace('- Kept the accounting engine, tax assumptions, storage schema and hosted deployment unchanged.','- Fixed the sidebar collapse-state type and aligned the full-app TypeScript target with ES2022; dependency-backed type checking passed on GitHub.\n- Kept the accounting engine, tax assumptions, storage schema and hosted deployment unchanged.');p.write_text(s)
          workflow=Path('.github/workflows/fix-workspace-types.yml');held=workflow.read_bytes();workflow.unlink()
          subprocess.run(['python','scripts/accounting/package-source.py'],check=True)
          with zipfile.ZipFile('public/offline/ledgerlab-source-code.zip') as z:
              Path('SOURCE-MANIFEST.json').write_bytes(z.read('LedgerLab/SOURCE-MANIFEST.json'))
          workflow.write_bytes(held)
      - name: Commit verified fixes only to review branch
        run: |
          test "$(git ls-remote origin refs/heads/ux/clearer-daily-workspace | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ledgerlab/app.tsx tsconfig.json docs/current/verification.md docs/current/guide.md README.md CHATGPT-START-HERE.md CHANGELOG.md SOURCE-MANIFEST.json
          git diff --cached --exit-code -- lib/accounting db drizzle
          git commit -m 'Fix CI type errors and verify dependency-backed React typecheck'
          git push origin HEAD:refs/heads/ux/clearer-daily-workspace
