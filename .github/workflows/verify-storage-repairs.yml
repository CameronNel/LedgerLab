name: Verify final LedgerLab storage repairs
on:
  push:
    branches: [ux/clearer-daily-workspace]
    paths: [.github/workflows/verify-storage-repairs.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'CameronNel/LedgerLab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Apply two exact reviewed repairs
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()=='f41d329fa08d983b4e751b84835282f6cc5ab04f'
          p=Path('scripts/desktop/preview.ts');s=p.read_text()
          old="const session=new WorkspaceSession((url,init)=>init?.method==='POST'&&store.mode==='browser'&&navigator.locks\n  ?navigator.locks.request(key,()=>transport(url,init)):transport(url,init));"
          new="const session=new WorkspaceSession(async(url,init)=>{\n  if(init?.method==='POST'&&store.mode==='browser'&&navigator.locks){\n    return await navigator.locks.request(key,()=>transport(url,init));\n  }\n  return await transport(url,init);\n});"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('scripts/desktop/check-local-storage.py');s=p.read_text()
          old="page.evaluate('Storage.prototype.setItem=window.originalSetItem')"
          new="page.evaluate('() => { Storage.prototype.setItem=window.originalSetItem; }')"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
      - run: npm install --global typescript@5.8.3 @types/node@22.19.19 --ignore-scripts --no-audit --no-fund
      - name: Rebuild and verify exact reviewed source
        run: |
          set -euo pipefail
          tsc -p tsconfig.standalone.json
          node scripts/desktop/check-source-syntax.mjs
          node scripts/desktop/bundle.mjs public/offline/LedgerLab-Workstation.html
          echo '85f33dbf229754c270186bea23b953f1bfad320cae9675fd1e2d0ffc6d2825c3  public/offline/LedgerLab-Workstation.html' | sha256sum --check
          mv .github/workflows/verify-storage-repairs.yml /tmp/verify-storage-repairs.yml
          python scripts/accounting/package-source.py
          python -c "import zipfile; z=zipfile.ZipFile('public/offline/ledgerlab-source-code.zip'); open('SOURCE-MANIFEST.json','wb').write(z.read('LedgerLab/SOURCE-MANIFEST.json'))"
          python scripts/accounting/package-check.py
          git add -A
          test "$(git write-tree)" = e84e3834360fb26b67819ad8a23d901ec7444576
          mv /tmp/verify-storage-repairs.yml .github/workflows/verify-storage-repairs.yml
          git add .github/workflows/verify-storage-repairs.yml
      - name: Verify dependency-backed application
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Real-origin storage acceptance
        run: |
          export CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python scripts/desktop/check-local-storage.py public/offline/LedgerLab-Workstation.html /tmp/storage-final
      - name: Commit verified repairs to the review branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/ux/clearer-daily-workspace | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix awaited storage-lock typing and native-function test restoration; rebuild verified standalone'
          git push origin HEAD:refs/heads/ux/clearer-daily-workspace
          echo 'Full application checks and real-origin browser storage acceptance passed before this commit.' >> "$GITHUB_STEP_SUMMARY"
