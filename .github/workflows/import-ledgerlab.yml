name: Import LedgerLab v3 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ledgerlab.yml']

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'CameronNel/LedgerLab'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify and import complete source archive
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, io, json, os, re, stat, urllib.request, urllib.parse, zipfile
          from html.parser import HTMLParser
          ARCHIVE_SHA = '47ba0b425c0a7b2a72f084ed03567cdb09a3e16f2abbea79eda28fd404749717'
          SHARE = 'zMDDK_JXpngg'
          NAME = 'LedgerLab-Workstation-v3-2026-09-07.zip'
          WORKFLOW = '.github/workflows/import-ledgerlab.yml'
          REPO = os.environ['GITHUB_REPOSITORY']
          assert REPO == 'CameronNel/LedgerLab'
          def read(url, method='GET', body=None, headers=None, limit=10000000):
              request = urllib.request.Request(url, data=body, method=method,
                  headers={'User-Agent': 'LedgerLab verified source import', **(headers or {})})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = response.read(limit + 1)
              assert len(result) <= limit, 'Response exceeds transfer limit'
              return result
          sources = []
          class Scripts(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      sources.append(attrs['src'])
          Scripts().feed(read('https://firestorage.ai/ja/f/' + SHARE).decode())
          api_base = None
          for src in sources:
              if any(skip in src for skip in ['polyfills', 'webpack', 'main-app', '4bd1b696', '3794-']):
                  continue
              url = urllib.parse.urljoin('https://firestorage.ai', src)
              assert urllib.parse.urlparse(url).hostname == 'firestorage.ai'
              script = read(url).decode()
              if '/files/${e.fileId}/download' not in script:
                  continue
              match = re.search(r'\bf\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', script)
              if match:
                  api_base = match.group(1)
              if not api_base:
                  candidates = sorted(set(re.findall(r'https://[^\s\"\x27`<>]+', script)))
                  raise RuntimeError('Download API base needs review: ' + repr(candidates))
              break
          assert api_base, 'No download interface found'
          parsed = urllib.parse.urlparse(api_base)
          assert parsed.scheme == 'https' and parsed.hostname and (parsed.hostname == 'firestorage.ai' or parsed.hostname.endswith('.firestorage.ai'))
          endpoint = api_base.rstrip('/') + '/shares/' + SHARE
          listing = json.loads(read(endpoint + '/files?maxResults=1000'))
          assert not listing.get('passwordProtected'), 'Unexpected protected share'
          files = [f for f in listing['files'] if f.get('fileName') == NAME]
          assert len(files) == 1, 'Expected exactly one matching archive'
          file_id = files[0]['fileId']
          assert re.fullmatch(r'[A-Za-z0-9_-]+', file_id)
          link = json.loads(read(endpoint + '/files/' + file_id + '/download', method='POST'))['downloadUrl']
          assert urllib.parse.urlparse(link).scheme == 'https'
          archive_bytes = read(link, limit=2000000)
          assert len(archive_bytes) == 1181882
          assert hashlib.sha256(archive_bytes).hexdigest() == ARCHIVE_SHA, 'Archive SHA-256 mismatch'
          print('Verified original ZIP SHA-256 and byte length', flush=True)
          project = {}
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              infos = archive.infolist()
              assert len(infos) == 223 and len({i.filename for i in infos}) == 223
              assert sum(i.file_size for i in infos) == 3810575
              for info in infos:
                  parts = info.filename.split('/')
                  assert parts[0] == 'LedgerLab' and all(p and p not in {'.','..','.git'} for p in parts)
                  assert not stat.S_ISLNK(info.external_attr >> 16) and not info.is_dir()
                  path = '/'.join(parts[1:])
                  assert not path.startswith('.github/') and not any(p.startswith('.env') for p in parts)
                  data = archive.read(info)
                  mode = '100755' if (info.external_attr >> 16) & 0o111 else '100644'
                  sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  project[path] = (data, mode, sha)
          manifest = json.loads(project['SOURCE-MANIFEST.json'][0])
          assert manifest['format'] == 'LedgerLab source package'
          assert len(manifest['files']) == 222
          assert {entry['path'] for entry in manifest['files']} == set(project) - {'SOURCE-MANIFEST.json'}
          for entry in manifest['files']:
              data = project[entry['path']][0]
              assert len(data) == entry['bytes'] and hashlib.sha256(data).hexdigest() == entry['sha256'], entry['path']
          print('Verified all 223 files and complete source manifest', flush=True)
          def github(path, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
              return json.loads(read('https://api.github.com/repos/' + REPO + path, method, body,
                  {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                   'Accept': 'application/vnd.github+json',
                   'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}))
          head = github('/git/ref/heads/main')['object']['sha']
          assert head == os.environ['GITHUB_SHA'], 'Branch changed; refusing to overwrite another commit'
          commit = github('/git/commits/' + head)
          base_tree = commit['tree']['sha']
          current = github('/git/trees/' + base_tree + '?recursive=1')
          assert not current['truncated']
          existing = {e['path']: e for e in current['tree'] if e['type'] == 'blob'}
          assert set(existing) == {'.gitignore', WORKFLOW}, 'Repository contains unexpected work; import stopped'
          assert existing['.gitignore']['sha'] == project['.gitignore'][2]
          entries = []
          for path, (data, mode, sha) in sorted(project.items()):
              entry = {'path': path, 'mode': mode, 'type': 'blob'}
              try:
                  entry['content'] = data.decode('utf-8')
              except UnicodeDecodeError:
                  result = github('/git/blobs', 'POST', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
                  assert result['sha'] == sha, path
                  entry['sha'] = result['sha']
              entries.append(entry)
          result = github('/git/trees', 'POST', {'base_tree': base_tree, 'tree': entries})
          new_tree = result['sha']
          remote = github('/git/trees/' + new_tree + '?recursive=1')
          assert not remote['truncated']
          remote_files = {e['path']: e for e in remote['tree'] if e['type'] == 'blob'}
          assert set(remote_files) == set(project) | {WORKFLOW}
          for path, (_, mode, sha) in project.items():
              assert remote_files[path]['sha'] == sha and remote_files[path]['mode'] == mode, path
          assert remote_files[WORKFLOW]['sha'] == existing[WORKFLOW]['sha']
          assert github('/git/ref/heads/main')['object']['sha'] == head, 'Branch changed during import'
          result = github('/git/commits', 'POST', {
              'message': 'Import complete LedgerLab Workstation v3 source (223 verified files)',
              'tree': new_tree, 'parents': [head]})
          commit_sha = result['sha']
          github('/git/refs/heads/main', 'PATCH', {'sha': commit_sha, 'force': False})
          assert github('/git/ref/heads/main')['object']['sha'] == commit_sha
          print('SUCCESS: committed 223 verified project files to main', flush=True)
          print('COMMIT_SHA=' + commit_sha)
          print('TREE_SHA=' + new_tree)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# LedgerLab v3 source imported\n\n')
              summary.write('223 source files verified against the original ZIP and individual Git blob hashes.\n\n')
              summary.write('Commit: `' + commit_sha + '`\n\nNo deployment or application build was performed.\n')
