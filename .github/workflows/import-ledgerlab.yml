name: Import LedgerLab v3 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ledgerlab.yml']

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve authorized share download interface
        shell: python
        run: |
          import urllib.request, urllib.parse, re
          from html.parser import HTMLParser
          base = 'https://firestorage.ai'
          def read(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'LedgerLab repository import'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read(2000000).decode('utf-8', 'replace')
          sources = []
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      sources.append(attrs['src'])
          Links().feed(read(base + '/ja/f/zMDDK_JXpngg'))
          for src in sources:
              if any(skip in src for skip in ['polyfills', 'webpack', 'main-app', '4bd1b696', '3794-']):
                  continue
              text = read(urllib.parse.urljoin(base, src))
              print('SCRIPT', src, 'BYTES', len(text))
              spans = []
              for match in re.finditer(r'fetch\(|/api/|downloadUrl|download_url|shareId|publicId', text):
                  a, b = max(0, match.start()-220), min(len(text), match.end()+420)
                  if spans and a <= spans[-1][1]:
                      spans[-1] = (spans[-1][0], b)
                  else:
                      spans.append((a,b))
              for a, b in spans[:35]:
                  print(text[a:b])
