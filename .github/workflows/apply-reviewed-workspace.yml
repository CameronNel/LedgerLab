name: Apply verified LedgerLab workspace cleanup
on:
  push:
    branches: [ux/clearer-daily-workspace]
    paths: [.github/workflows/apply-reviewed-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'CameronNel/LedgerLab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Download and verify source-only patch
        shell: python
        run: |
          import hashlib, io, json, re, urllib.request, urllib.parse, zipfile
          from pathlib import Path
          from html.parser import HTMLParser
          SHARE='DPe_PamxALiD'
          NAME='ledgerlab-source-patch-verified.zip'
          def read(url,method='GET',limit=10000000):
              request=urllib.request.Request(url,method=method,headers={'User-Agent':'LedgerLab verified source transfer'})
              with urllib.request.urlopen(request,timeout=60) as response: result=response.read(limit+1)
              assert len(result)<=limit,'Transfer limit exceeded'
              return result
          sources=[]
          class Scripts(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='script' and attrs.get('src'): sources.append(attrs['src'])
          Scripts().feed(read('https://firestorage.ai/ja/f/'+SHARE).decode())
          api_base=None
          for src in sources:
              if any(skip in src for skip in ['polyfills','webpack','main-app','4bd1b696','3794-']): continue
              url=urllib.parse.urljoin('https://firestorage.ai',src)
              assert urllib.parse.urlparse(url).hostname=='firestorage.ai'
              script=read(url).decode()
              if '/files/${e.fileId}/download' not in script: continue
              match=re.search(r'\bf\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]',script)
              if match: api_base=match.group(1)
              if not api_base: raise RuntimeError('Download interface changed; refuse unverified transfer')
              break
          assert api_base,'No download interface found'
          parsed=urllib.parse.urlparse(api_base)
          assert parsed.scheme=='https' and parsed.hostname and (parsed.hostname=='firestorage.ai' or parsed.hostname.endswith('.firestorage.ai'))
          endpoint=api_base.rstrip('/')+'/shares/'+SHARE
          listing=json.loads(read(endpoint+'/files?maxResults=1000'))
          assert not listing.get('passwordProtected')
          files=[f for f in listing['files'] if f.get('fileName')==NAME]
          assert len(files)==1
          file_id=files[0]['fileId'];assert re.fullmatch(r'[A-Za-z0-9_-]+',file_id)
          link=json.loads(read(endpoint+'/files/'+file_id+'/download',method='POST'))['downloadUrl']
          assert urllib.parse.urlparse(link).scheme=='https'
          data=read(link,limit=100000)
          assert len(data)==54539
          assert hashlib.sha256(data).hexdigest()=='304a2099de7a690c79dcabdaafb286db3a7fa079d239f10be90175544f311295'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.namelist()==['ledgerlab-cleanup.patch']
              patch=archive.read('ledgerlab-cleanup.patch')
          assert len(patch)==176358
          assert hashlib.sha256(patch).hexdigest()=='77577ec8dc8b6bd7be4e124f6a75be192fc5f3a2c0a2bccb833780fd2ffcada7'
          Path('/tmp/ledgerlab-cleanup.patch').write_bytes(patch)
          print('Verified exact source-only patch. No learner backups or credentials transferred.')
      - name: Apply without changing accounting logic
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 4078d7fbf098c7c0e69848303f15b5bc41e59f6f -- . ':!.github'
          git apply --check /tmp/ledgerlab-cleanup.patch
          git apply --index /tmp/ledgerlab-cleanup.patch
          git diff --cached --exit-code -- lib/accounting db drizzle
      - name: Install isolated verification compiler
        run: npm install --global typescript@5.8.3 @types/node@22.19.19 --ignore-scripts --no-audit --no-fund
      - name: Verify and rebuild standalone
        run: |
          node scripts/accounting/run-portable.mjs workspace
          tsc -p tsconfig.standalone.json
          node scripts/desktop/check-source-syntax.mjs
          node scripts/desktop/bundle.mjs public/offline/LedgerLab-Workstation-v3.1.html
          echo 'fa0a7fd060550cdb4394ee5e4e3d5d31276238fd536bba95207f901622e8be85  public/offline/LedgerLab-Workstation-v3.1.html' | sha256sum --check
      - name: Package and verify exact reviewed source tree
        run: |
          mv .github/workflows/apply-reviewed-workspace.yml /tmp/apply-reviewed-workspace.yml
          python scripts/accounting/package-source.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('public/offline/ledgerlab-source-code.zip') as z:
              Path('SOURCE-MANIFEST.json').write_bytes(z.read('LedgerLab/SOURCE-MANIFEST.json'))
          PY
          echo 'a5f897a29531816ce48b01ed5654e365d5579ba2e94d3178616699622d1de158  SOURCE-MANIFEST.json' | sha256sum --check
          git add -A
          test "$(git write-tree)" = 'f29dc05b08c63b997d6ddf2c267ca64dbe106bc3'
          mv /tmp/apply-reviewed-workspace.yml .github/workflows/apply-reviewed-workspace.yml
          git add .github/workflows/apply-reviewed-workspace.yml
      - name: Commit only to the review branch
        run: |
          test "$(git ls-remote origin refs/heads/ux/clearer-daily-workspace | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement LedgerLab 3.1 clearer daily workspace with tested search and review responses'
          git push origin HEAD:refs/heads/ux/clearer-daily-workspace
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo 'Reviewed source applied; main and the hosted application were not changed.' >> "$GITHUB_STEP_SUMMARY"
