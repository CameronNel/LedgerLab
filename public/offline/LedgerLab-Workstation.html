    { id: 'L01', title: 'Think in double entry', category: 'Foundations', level: 'Foundation', objective: 'Translate a business event into a change in assets, liabilities, equity, income or expenses.', explanation: ['Start with what happened economically. A debit is the left side of an entry; a credit is the right. Neither word means good, bad, receipt or payment by itself.', 'Assets and expenses normally increase with debits. Liabilities, equity and income normally increase with credits. Contra accounts run in the opposite direction.', 'Every journal balances, but a balanced journal can still use the wrong date, account, amount or counterparty. Ask which financial statement assertions your evidence supports.'], example: { narration: 'Buy $500 of office supplies on credit, with $50 recoverable GST.', lines: [(0, accounts_1.dr)('6220', 50000), (0, accounts_1.dr)('1400', 5000), (0, accounts_1.cr)('2000', 55000, 'S3')] }, checklist: ['Identify the source event and accounting date.', 'Separate the net amount from recoverable or output tax.', 'Choose the balance-sheet and profit-or-loss effects.', 'Check debit total equals credit total.'], pitfalls: ['Treating every bank receipt as revenue.', 'Using a suspense account as a permanent answer.'] },

    { id: 'L03', title: 'Cash accounting versus accrual accounting', category: 'Foundations', level: 'Foundation', objective: 'Separate earning or consuming a resource from paying for it.', explanation: ['Cash timing answers when money moved. Accrual accounting answers when income was earned and resources were consumed. Those dates often differ.', 'A prepayment is a future service right. An accrued expense is a present obligation for a service already received. A customer advance is usually a liability until the relevant work is earned.', 'Period-end accounting needs both the cash record and evidence about delivery, service coverage and obligations.'], example: { narration: 'Accrue a $900 service received in December but invoiced in January, without input GST at the accrual stage under the case policy.', lines: [(0, accounts_1.dr)('6110', 90000), (0, accounts_1.cr)('2100', 90000)] }, checklist: ['Identify the service or performance period.', 'Separate payment date, invoice date and recognition date.', 'Plan how the accrual or deferral will clear.'], pitfalls: ['Assuming an invoice dated January cannot belong in December.'] },

    { id: 'L10', title: 'Prepaid expenses', category: 'Month-end', level: 'Foundation', objective: 'Allocate a payment over the period that benefits from it.', explanation: ['A prepayment represents unconsumed services or coverage. Set out invoice net value, coverage start and end, monthly allocation, cumulative expense and remaining asset.', 'Release only the part consumed. Recoverable GST is normally accounted for separately from the prepaid net cost, so do not calculate it again on the monthly release.', 'Use daily or other allocation when appropriate. The case deliberately uses equal monthly releases.'], example: { narration: 'Release one month of a $6,000 annual subscription.', lines: [(0, accounts_1.dr)('6210', 50000), (0, accounts_1.cr)('1310', 50000)] }, checklist: ['Check coverage dates, not just invoice date.', 'Reconcile opening plus additions less releases to closing.', 'Confirm closing balance represents future service.'], pitfalls: ['Releasing the entire balance because the invoice has been paid.'] },
